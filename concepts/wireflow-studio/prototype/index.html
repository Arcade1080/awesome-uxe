<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wireflow Studio Prototyp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE work tool: calm, precise, product-grade
   IDEA a shipped Figma-like design tool, mid-session on a real wireflow inside Claude Code
   PICTURE the live canvas: hi-fi screens wired by arrows, two decisions, a pending Claude proposal
   COLOUR neutral chrome, selection blue, Claude violet; Acme teal lives only inside the frames
   TYPE Inter for the tool chrome, Figtree as the Acme UI typeface inside screens
   LAYOUT top bar, layers left, canvas centre, inspector right, Claude bar below; side panels become drawers under 900px */
:root{color-scheme:light dark;
--bg:light-dark(#ececf0,#151519);--dot:light-dark(#cfcfd6,#2d2d34);
--panel:light-dark(#ffffff,#212126);--panel2:light-dark(#f5f5f7,#2a2a30);--line:light-dark(#e2e2e8,#37373e);
--ink:light-dark(#1b1b1f,#ececf1);--muted:light-dark(#5f5f69,#a3a3ad);
--sel:light-dark(#2f6bff,#6f97ff);--sel-soft:light-dark(#e8efff,#25314c);--on-sel:light-dark(#ffffff,#0b1020);
--ai:light-dark(#6a4cf5,#a48fff);--ai-soft:light-dark(#f1edff,#2c2640);--on-ai:light-dark(#ffffff,#120c26);
--warn:light-dark(#b54708,#f3a35b);--warn-soft:light-dark(#fff4e5,#3a2c1c);
--ok:light-dark(#1f7a4d,#62cf96);--ok-soft:light-dark(#e7f5ee,#1c3328);
--bad:light-dark(#b42318,#ff8a7a);--bad-soft:light-dark(#fdecea,#3d2220);
--shadow:0 1px 2px rgb(0 0 0/.08),0 6px 20px rgb(0 0 0/.10)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
svg.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.top{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:6px 10px;min-height:50px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand b{font-weight:600}
.crumb{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.modes{display:flex;gap:2px;padding:3px;margin:0 auto;background:var(--panel2);border:1px solid var(--line);border-radius:10px}
.modes button{display:flex;align-items:center;gap:6px;border:0;background:none;padding:5px 12px;min-height:32px;border-radius:7px;color:var(--muted);font-weight:500;white-space:nowrap}
.modes button[aria-pressed=true]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.modes kbd{font:inherit;color:var(--muted);opacity:.8}
.tr{display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--ok-soft);color:var(--ok);font-weight:500;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:32px;padding:5px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-weight:500;white-space:nowrap}
.btn:hover{background:var(--panel2)}
.btn.pri{background:var(--sel);border-color:var(--sel);color:var(--on-sel)}
.btn.ai{background:var(--ai);border-color:var(--ai);color:var(--on-ai)}
.btn.sm{min-height:28px;padding:3px 10px}
.ib{display:inline-grid;place-items:center;width:34px;height:34px;border:0;border-radius:8px;background:none;color:var(--ink)}
.ib:hover{background:var(--panel2)}
.ptg{display:none}
.menu{position:absolute;right:10px;top:48px;z-index:40;min-width:220px;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px}
.menu button:hover{background:var(--panel2)}
.menu small{display:block;color:var(--muted)}
.work{display:grid;grid-template-columns:248px minmax(0,1fr) 300px;min-height:0;position:relative}
.side{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-right:1px solid var(--line)}
.side.r{border-right:0;border-left:1px solid var(--line)}
.tabs{display:flex;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:8px 9px;margin-bottom:-1px;border-bottom:2px solid transparent;color:var(--muted);font-weight:500;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--ink)}
.pane{flex:1;min-height:0;overflow:auto;padding:8px 12px 16px}
.hint{color:var(--muted);margin:6px 0}
.grp{margin:14px 0 6px;color:var(--muted);font-weight:600}
.grp:first-child{margin-top:6px}
.tree{list-style:none;margin:0;padding:0}
.tree button{display:flex;align-items:center;gap:7px;width:100%;padding:5px 6px;border:0;border-radius:6px;background:none;text-align:left;white-space:nowrap;overflow:hidden}
.tree button span{overflow:hidden;text-overflow:ellipsis}
.tree button:hover{background:var(--panel2)}
.tree button[aria-current=true]{background:var(--sel-soft);color:var(--sel)}
.tree button.dim{color:var(--muted)}
.tree .l1{padding-left:20px}.tree .l2{padding-left:38px}
.tree em{margin-left:auto;font-style:normal;color:var(--muted)}
.tree .aiTxt{color:var(--ai)}
.comp{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:6px 8px;border:1px solid transparent;border-radius:7px;background:none;text-align:left}
.comp:hover{background:var(--panel2)}
.comp[aria-pressed=true]{border-color:var(--sel);background:var(--sel-soft)}
.comp em{font-style:normal;color:var(--muted)}
.gapc{padding:8px 10px;margin-top:6px;border:1px dashed var(--warn);border-radius:8px;color:var(--warn);background:var(--warn-soft)}
.search{width:100%;height:34px;margin:4px 0 2px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);font-size:16px}
.tokrow{display:flex;align-items:center;gap:10px;padding:4px 0}
.tokrow .sw{width:24px;height:24px}
.tk code{display:block;font:inherit;overflow-wrap:anywhere}
.tk small{display:block;font-size:13px;color:var(--muted)}
.sw.bx{display:grid;place-items:center;border:0;background:var(--panel2);font-size:13px;font-style:normal;color:var(--muted);width:24px;height:24px}
.sw{width:18px;height:18px;border-radius:5px;border:1px solid rgb(0 0 0/.15);flex:none}
.bar{display:block;height:8px;border-radius:2px;background:var(--sel);opacity:.55}
.stage{position:relative;overflow:hidden;background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.1px,transparent 1.3px);background-size:20px 20px;touch-action:none;user-select:none;-webkit-user-select:none}
.stage.hand,.stage.space{cursor:grab}.stage.grabbing{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0;--iz:1}
.node{position:absolute}
.frame{position:relative;width:360px;height:740px;background:#fff;border-radius:3px;box-shadow:0 1px 3px rgb(0 0 0/.14),0 10px 30px rgb(0 0 0/.07)}
.ftitle{position:absolute;left:0;right:0;overflow:hidden;bottom:100%;margin-bottom:calc(7px*var(--iz));display:flex;align-items:center;gap:calc(6px*var(--iz));font-size:calc(13px*var(--iz));color:var(--muted);white-space:nowrap;cursor:move}
.ftitle b{font-weight:500;color:var(--ink);overflow:hidden;text-overflow:ellipsis}
.ftitle span{flex:none}
.world.narrow .ftitle span{display:none}
.ftitle .t{padding:0 calc(6px*var(--iz));border-radius:calc(4px*var(--iz));background:var(--ok-soft);color:var(--ok)}
.ftitle .t.w{background:var(--warn-soft);color:var(--warn)}
.ftitle .t.a{background:var(--ai-soft);color:var(--ai)}
.node.sel .frame{outline:calc(2px*var(--iz)) solid var(--sel)}
.node.sel .ftitle b{color:var(--sel)}
.node.hl .frame{outline:calc(3px*var(--iz)) solid var(--ai);animation:pulse 1.2s ease 2}
@keyframes pulse{50%{outline-offset:calc(10px*var(--iz))}}
.node.ghost .frame{outline:calc(2px*var(--iz)) dashed var(--ai);outline-offset:calc(5px*var(--iz))}
.node.ghost.sel .frame{outline-style:solid}
.gbar{position:absolute;left:0;top:100%;margin-top:calc(12px*var(--iz));display:flex;gap:calc(6px*var(--iz))}
.gbar button{padding:calc(5px*var(--iz)) calc(12px*var(--iz));border-radius:calc(8px*var(--iz));font-size:calc(13px*var(--iz));font-weight:500;border:calc(1px*var(--iz)) solid var(--ai);background:var(--panel);color:var(--ai)}
.gbar button.y{background:var(--ai);color:var(--on-ai)}
.el{position:relative}
.node.sel .el:hover{outline:calc(1px*var(--iz)) solid var(--sel);outline-offset:2px}
.el.esel{outline:calc(2px*var(--iz)) solid var(--sel)!important;outline-offset:2px}
.el.mark{outline:calc(2px*var(--iz)) dashed var(--sel);outline-offset:3px}
.el.flag::after{content:"!";position:absolute;right:-8px;top:-8px;width:calc(18px*var(--iz));height:calc(18px*var(--iz));border-radius:50%;background:var(--warn);color:#fff;font:700 calc(12px*var(--iz))/calc(18px*var(--iz)) Inter,sans-serif;text-align:center}
.dec{width:120px;height:120px;display:grid;place-items:center;text-align:center;cursor:move}
.dec svg{position:absolute;inset:0;overflow:visible}
.dec polygon{fill:var(--panel);stroke:var(--muted);stroke-width:1.5}
.node.sel .dec polygon{stroke:var(--sel);stroke-width:calc(2.5px*var(--iz))}
.dec span{position:relative;max-width:80px;font:600 14px/1.2 Inter,sans-serif}
.wb{position:absolute;left:50%;bottom:100%;margin-bottom:calc(8px*var(--iz));transform:translateX(-50%);display:flex;align-items:center;gap:calc(5px*var(--iz));padding:calc(3px*var(--iz)) calc(9px*var(--iz));border-radius:999px;background:var(--warn-soft);color:var(--warn);border:calc(1px*var(--iz)) solid var(--warn);font-size:calc(13px*var(--iz));font-weight:500;white-space:nowrap}
.wb{z-index:3}
.wb svg{width:calc(14px*var(--iz));height:calc(14px*var(--iz))}
svg.edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.edges path{fill:none;stroke:var(--muted);stroke-width:calc(1.6px*var(--iz))}
.edges path.g{stroke:var(--ai);stroke-dasharray:6 5}
.edges path.on{stroke:var(--sel);stroke-width:calc(2.4px*var(--iz))}
.edges circle{fill:var(--muted)}.edges circle.g{fill:var(--ai)}.edges circle.on{fill:var(--sel)}
.elabel{position:absolute;transform:translate(-50%,-50%);padding:calc(2px*var(--iz)) calc(8px*var(--iz));border-radius:999px;border:calc(1px*var(--iz)) solid var(--line);background:var(--panel);color:var(--muted);font-size:calc(13px*var(--iz));white-space:nowrap;pointer-events:none}
.elabel.g{color:var(--ai);border-color:var(--ai)}
.elabel.minor{display:none}
.world.near .elabel.minor,.elabel.minor.on{display:block}
.elabel.on{color:var(--sel);border-color:var(--sel)}
.world.lowz .elabel{display:none}
.toolbar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:2px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:5}
.toolbar button{display:grid;place-items:center;width:36px;height:36px;border:0;border-radius:8px;background:none}
.toolbar button:hover{background:var(--panel2)}
.toolbar button[aria-pressed=true]{background:var(--sel);color:var(--on-sel)}
.toolbar .sep{width:1px;margin:6px 3px;background:var(--line)}
.zoom{position:absolute;right:12px;bottom:14px;display:flex;align-items:center;gap:2px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);z-index:5}
.zoom output{min-width:48px;text-align:center;font-variant-numeric:tabular-nums}
.scr{position:relative;width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden;text-align:left}
.scr .body{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;padding:6px 16px 18px}
.scr .grow{flex:1}
.scr h2{margin:2px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.hifi{font:15px/1.45 Figtree,Inter,system-ui,sans-serif;color:#0f1a1c;background:#fff}
.hifi .sb{display:flex;justify-content:space-between;align-items:center;padding:12px 22px 6px;font-weight:600;font-size:14px}
.hifi .sb span{display:flex;gap:5px;align-items:center}
.hifi .ab{display:flex;align-items:center;gap:6px;padding:4px 12px 10px}
.hifi .ab svg{width:22px;height:22px;color:#0b6e79}
.hifi .ab b{font-size:17px;font-weight:600}
.hifi .ab small{display:block;font-size:13px;color:#5b6b70}
.hifi h2{font-size:22px;line-height:1.25;font-weight:700}
.hifi .tx{display:flex;gap:8px;align-items:flex-start;font-size:14px;color:#5b6b70}
.hifi .tx svg{color:#0b6e79;margin-top:2px}
.hifi label{display:block;margin-bottom:6px;font-size:13px;font-weight:600;color:#5b6b70}
.hifi .inp{display:flex;align-items:center;gap:8px;height:46px;padding:0 12px;border:1px solid #c9d4d6;border-radius:10px;background:#fff}
.hifi .inp svg{color:#5b6b70}
.hifi .chip{display:inline-flex;align-items:center;height:34px;padding:0 14px;border:1px solid #c9d4d6;border-radius:999px;font-size:14px;font-weight:500}
.hifi .chip.on{background:#0b6e79;border-color:#0b6e79;color:#fff}
.hifi .bt{display:flex;align-items:center;justify-content:center;height:48px;border-radius:12px;font-size:15px;font-weight:600}
.hifi .bt.primary{background:#0b6e79;color:#fff}
.hifi .bt.secondary{background:#e6f2f3;color:#0b6e79}
.hifi .bt.ghost{color:#0b6e79}
.hifi .card{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid #e1e8ea;border-radius:14px}
.hifi .av{display:grid;place-items:center;width:42px;height:42px;flex:none;border-radius:50%;background:#e6f2f3;color:#0b6e79;font-weight:700;font-size:14px}
.hifi .card b{display:block;font-size:15px;line-height:1.3}
.hifi .sub{font-size:13px;color:#5b6b70}
.hifi .meta{font-size:13px;color:var(--meta,#7c8a8e)}
.hifi .badge{display:inline-block;margin-top:6px;padding:2px 8px;border-radius:999px;background:#e7f5ee;color:#1f7a4d;font-size:13px;font-weight:600}
.hifi .alert{display:flex;gap:10px;padding:12px;border:1px solid #f3c1bb;border-radius:12px;background:#fdecea;font-size:14px;color:#5b2a25}
.hifi .alert svg{color:#b42318;margin-top:2px}
.hifi .alert b{display:block;color:#8f1d12}
.hifi .sum{padding:2px 12px;border:1px solid #e1e8ea;border-radius:14px}
.hifi .sum div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #edf1f2;font-size:14px}
.hifi .sum div:last-child{border:0}
.hifi .sum span{color:#5b6b70}
.hifi .cb{display:flex;align-items:center;gap:10px;font-size:14px}
.hifi .cb i{display:grid;place-items:center;width:22px;height:22px;border-radius:6px;background:#0b6e79;color:#fff}
.hifi .okx{display:grid;justify-items:center;gap:8px;padding:28px 6px 6px;text-align:center}
.hifi .okx i{display:grid;place-items:center;width:76px;height:76px;border-radius:50%;background:#e7f5ee;color:#1f7a4d}
.hifi .okx svg{width:36px;height:36px;stroke-width:2.4}
.hifi .okx .tx{justify-content:center}
.lofi{font:14px/1.4 Inter,system-ui,sans-serif;color:#52525b;background:#fff}
.lofi svg.ic{display:none}
.lofi .sb{height:22px;margin:10px 16px 2px;border-bottom:1.5px dashed #d4d4d8;font-size:0}
.lofi .ab{display:flex;gap:8px;padding:10px 16px;border-bottom:1.5px solid #e4e4e7}
.lofi .ab::before{content:"‹";font-weight:700}
.lofi .ab.nb::before{content:none}
.lofi .ab small{margin-left:8px;color:#a1a1aa}
.lofi h2{font-size:19px;color:#3f3f46}
.lofi .tx{color:#71717a}
.lofi label{display:block;margin-bottom:4px;font-size:13px;color:#71717a}
.lofi .inp{display:flex;align-items:center;height:42px;padding:0 10px;border:1.5px solid #a1a1aa;border-radius:4px;color:#71717a}
.lofi .chip{display:inline-flex;align-items:center;height:32px;padding:0 12px;border:1.5px solid #a1a1aa;border-radius:16px}
.lofi .chip.on{background:#d4d4d8;color:#27272a}
.lofi .bt{display:flex;align-items:center;justify-content:center;height:44px;border:1.5px solid #52525b;border-radius:4px;font-weight:600;color:#3f3f46}
.lofi .bt.primary{background:#52525b;color:#fff}
.lofi .bt.ghost{border-style:dashed}
.lofi .card,.lofi .sum,.lofi .alert{display:flex;gap:10px;padding:10px;border:1.5px solid #a1a1aa;border-radius:4px}
.lofi .sum{display:block}.lofi .sum div{display:flex;justify-content:space-between;padding:6px 0}
.lofi .av{width:42px;height:42px;flex:none;border:1.5px solid #a1a1aa;color:transparent;background:linear-gradient(to top right,transparent 49%,#a1a1aa 49.5% 50.5%,transparent 51%),linear-gradient(to bottom right,transparent 49%,#a1a1aa 49.5% 50.5%,transparent 51%)}
.lofi .card b{display:block}.lofi .sub,.lofi .meta{color:#a1a1aa;font-size:13px}
.lofi .badge{display:inline-block;margin-top:4px;padding:0 6px;border:1.5px solid #a1a1aa;border-radius:10px;font-size:13px}
.lofi .alert b{display:block}
.lofi .cb{display:flex;gap:8px;align-items:center}.lofi .cb i{width:20px;height:20px;border:1.5px solid #52525b;border-radius:3px}
.lofi .okx{display:grid;justify-items:center;gap:6px;padding:24px 0 6px;text-align:center}
.lofi .okx i{width:72px;height:72px;border:1.5px solid #a1a1aa;border-radius:50%}
.anim .scr{animation:fade .22s ease}
@keyframes fade{from{opacity:.25}}
.jl{position:absolute;left:0;width:140px;padding-top:4px;font-size:14px;font-weight:600;color:var(--muted)}
.jbox{position:absolute;display:flex;flex-direction:column;gap:8px}
.jhead{display:flex;align-items:center;gap:8px;height:48px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:16px;font-weight:600}
.jhead i{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--panel2);font-style:normal;font-size:13px;color:var(--muted)}
.jc{padding:8px 11px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:14px;line-height:1.4;cursor:pointer}
.jc:hover{border-color:var(--sel)}
.jc.th{font-style:italic;color:var(--muted)}
.jc.pain{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.jc.opp{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.jc small{display:block;margin-top:4px;color:var(--muted);font-style:normal}
.jc.sel{outline:2px solid var(--sel);outline-offset:1px}
.jchips{display:flex;flex-wrap:wrap;gap:6px}
.jchip{padding:3px 10px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-size:13px;white-space:nowrap}
button.jchip:hover{border-color:var(--sel);color:var(--sel)}
.persona{position:absolute;display:flex;align-items:center;gap:14px;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--panel);font-size:14px}
.persona .av2{display:grid;place-items:center;width:40px;height:40px;flex:none;border-radius:50%;background:var(--sel-soft);color:var(--sel);font-weight:600}
.persona b{font-size:16px}
svg.emo{position:absolute;overflow:visible}
.emo path{fill:none;stroke:var(--sel);stroke-width:2.5}
.emo line{stroke:var(--line);stroke-dasharray:4 5}
.emo circle{fill:var(--panel);stroke:var(--sel);stroke-width:2.5}
.emo circle.low{stroke:var(--bad);fill:var(--bad)}
.emo text{font:500 13px Inter,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px}
.emo text.low{fill:var(--bad)}
.emo text.ax{fill:var(--muted)}
.proto{position:absolute;inset:0;display:none;overflow:auto;padding:20px 16px}
.app[data-mode=proto] .proto{display:flex;align-items:center;justify-content:center;gap:28px}
.proto.col{flex-direction:column;justify-content:flex-start;gap:14px}
.app[data-mode=proto] .world,.app[data-mode=proto] .toolbar,.app[data-mode=proto] .zoom{display:none}
.devbox{position:relative;flex:none}
.proto.col .ptask{width:min(384px,100%)}
.device{position:absolute;left:0;top:0;width:384px;height:764px;padding:12px;border-radius:46px;background:#16161a;box-shadow:0 0 0 2px #3a3a42,0 24px 60px rgb(0 0 0/.25);transform-origin:0 0}
.device .scr{border-radius:34px;background:#fff}
.device .hot{cursor:pointer}
.device.flash .hot{box-shadow:0 0 0 3px rgb(47 107 255/.55);background-color:rgb(47 107 255/.10);border-radius:12px}
.device.showhot .hot{box-shadow:0 0 0 2px rgb(47 107 255/.45)}
.slide .scr{animation:slide .26s ease}
@keyframes slide{from{transform:translateX(28px);opacity:0}}
.ptask{flex:none;width:250px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);box-shadow:var(--shadow)}
.ptask b{display:block}
.sec{padding:12px 0;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec h3{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:13px;font-weight:600}
.sec h3 .tag{margin-left:auto}
.row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:8px;align-items:center;padding:3px 0}
.row>span:first-child{color:var(--muted)}
.tok{display:inline-block;max-width:100%;vertical-align:middle;padding:1px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tok .sw{display:inline-block;width:12px;height:12px;margin-right:6px;border-radius:3px;vertical-align:-1px}
.row.st{grid-template-columns:minmax(0,1fr);gap:2px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-weight:500;white-space:nowrap;background:var(--panel2);color:var(--muted)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.ai{background:var(--ai-soft);color:var(--ai)}.tag.bad{background:var(--bad-soft);color:var(--bad)}
.meter{height:6px;margin-top:6px;border-radius:3px;background:var(--panel2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok)}
.issue{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.issue:first-of-type{border-top:0}
.issue svg{margin-top:1px}
.issue div{flex:1}
.lnk{border:0;background:none;padding:0;color:var(--sel);font-weight:500;text-decoration:underline;text-underline-offset:2px}
pre.code{margin:0;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);overflow:auto;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre}
.code .k{color:var(--ai)}.code .s{color:var(--ok)}.code .c{color:var(--muted)}
blockquote{margin:6px 0;padding:6px 10px;border-left:2px solid var(--line);color:var(--muted);font-style:italic}
blockquote small{display:block;font-style:normal}
.sw2{position:relative;width:38px;height:22px;flex:none;border:0;border-radius:999px;background:var(--line)}
.sw2::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgb(0 0 0/.25);transition:transform .15s}
.sw2[aria-checked=true]{background:var(--sel)}
.sw2[aria-checked=true]::after{transform:translateX(16px)}
.varrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0}
.varrow code{font:13px ui-monospace,Menlo,monospace}
.path{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.claude{display:grid;gap:8px;padding:8px 12px 10px;background:var(--panel);border-top:1px solid var(--line)}
.cmsg{display:none;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid color-mix(in srgb,var(--ai) 30%,transparent);border-radius:10px;background:var(--ai-soft);max-height:34vh;overflow:auto}
.cmsg.on{display:flex}
.cmsg>svg{color:var(--ai);margin-top:2px}
.cmsg .grow{flex:1}
.cmsg ol{margin:4px 0 0;padding-left:18px}
.cmsg li{color:var(--muted)}
.cmsg li.done{color:var(--ink)}
.cmsg li.now::marker{color:var(--ai)}
.cmsg .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cbar{display:flex;align-items:center;gap:8px}
.cbar>svg{color:var(--ai)}
.cbar input{flex:1;height:38px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);font-size:16px}
.ctx{padding:3px 9px;border-radius:999px;background:var(--sel-soft);color:var(--sel);font-weight:500;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.sugs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.sug{flex:none;padding:5px 12px;border:1px solid color-mix(in srgb,var(--ai) 35%,transparent);border-radius:999px;background:var(--ai-soft);color:var(--ai);font-weight:500;white-space:nowrap}
.sug:hover{border-color:var(--ai)}
.sample{margin-left:auto;color:var(--muted);white-space:nowrap}
.toast{position:fixed;left:50%;top:62px;z-index:60;transform:translateX(-50%);max-width:min(560px,calc(100vw - 32px));padding:10px 14px;border-radius:10px;background:var(--ink);color:var(--panel);box-shadow:var(--shadow)}
.dlgw{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:16px;background:rgb(0 0 0/.35)}
.dlg{width:min(640px,100%);max-height:86vh;display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:12px;background:var(--panel);box-shadow:var(--shadow)}
.dlg h2{margin:0;font-size:17px}
.dlg pre{flex:1;min-height:0}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px}
.edges circle{r:calc(4px*var(--iz))}
.sug{display:inline-flex;align-items:center;gap:6px}
.sug:disabled{opacity:.55;cursor:default}
.cmsg details{margin-top:6px}
.cmsg summary{cursor:pointer;color:var(--ai);font-weight:500}
.cmsg ul{margin:4px 0 0;padding-left:18px}
.cmsg code,.hint code{font:13px ui-monospace,SFMono-Regular,Menlo,monospace}
.toast{display:flex;align-items:center;gap:12px}
.toast button{flex:none;padding:4px 10px;border:1px solid currentColor;border-radius:6px;background:none;color:inherit;font-weight:500}
.issue>span{flex:none}
.ptask .pdesc{display:block}
.btn .ic,.sug .ic{width:15px;height:15px}
[hidden]{display:none!important}
@media (max-width:1180px){.work{grid-template-columns:220px minmax(0,1fr) 272px}.crumb{display:none}}
@media (max-width:900px){
.work{grid-template-columns:minmax(0,1fr)}
.side{position:absolute;top:0;bottom:0;z-index:20;width:min(300px,88vw);box-shadow:var(--shadow);display:none}
.side.l{left:0}.side.r{right:0}
.side.open{display:flex}
.ptg{display:inline-grid}
.pill span,.modes kbd,.share{display:none}}
@media (max-width:600px){
.top{gap:6px}
.brand b{display:none}
.modes{order:5;width:100%;margin:0}
.modes button{flex:1;justify-content:center;padding:5px 4px}
.toolbar{left:10px;transform:none}
.toolbar .opt{display:none}
.zoom{right:10px}
.ctx,.sample{display:none}
.tr{margin-left:auto}
.cmsg.on+.sugs{display:none}
.ptask .pdesc{display:none}
}
@media (pointer:coarse){.btn,.modes button,.tabs button,.sug,.tree button{min-height:44px}.toolbar button,.ib{width:44px;height:44px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app" data-mode="design">
  <header class="top">
    <button class="ib ptg" id="tgL" aria-label="Ebenen-Panel ein- oder ausblenden" aria-expanded="false"><i data-ic="panelL"></i></button>

    </div>
  </header>

  <main class="work">
    <aside class="side l" id="left" aria-label="Ebenen, Komponenten und Tokens">

      </div>
      <div class="pane" id="lpane"></div>
    </aside>

    <section class="stage" id="stage" aria-label="Canvas">
      <div class="world" id="world"></div>
      <div class="proto" id="proto">
        <div class="ptask" id="ptask"></div>
        <div class="devbox" id="devbox"><div class="device" id="device"></div></div>
      </div>
      <div class="toolbar" role="toolbar" aria-label="Werkzeuge">

        <button data-tool="hand" aria-pressed="false" title="Hand (H)" aria-label="Hand"><i data-ic="hand"></i></button>
        <span class="sep"></span>
        <button data-tool="frame" aria-pressed="false" title="Screen (F)" aria-label="Screen"><i data-ic="phone"></i></button>
        <button data-tool="link" aria-pressed="false" title="Verbindung (C)" aria-label="Verbindung"><i data-ic="link"></i></button>
        <button data-tool="decision" aria-pressed="false" title="Entscheidung (D)" aria-label="Entscheidung"><i data-ic="diamond"></i></button>
        <button class="opt" data-tool="text" aria-pressed="false" title="Text (T)" aria-label="Text"><i data-ic="text"></i></button>
        <button class="opt" data-tool="comment" aria-pressed="false" title="Kommentar (K)" aria-label="Kommentar"><i data-ic="comment"></i></button>
      </div>
      <div class="zoom">
        <button class="ib" id="zOut" aria-label="Verkleinern" title="Verkleinern (−)"><i data-ic="minus"></i></button>
        <output id="zVal">100 %</output>
        <button class="ib" id="zIn" aria-label="Vergrößern" title="Vergrößern (+)"><i data-ic="plus"></i></button>
        <button class="ib" id="zFit" aria-label="Alles zeigen" title="Alles zeigen (Umschalt + 1)"><i data-ic="fit"></i></button>
      </div>
    </section>

    <aside class="side r" id="right" aria-label="Inspector">
      <div class="tabs" role="tablist" id="rtabs"></div>
      <div class="pane" id="rpane"></div>
    </aside>
  </main>

  <footer class="claude" aria-label="Claude">
    <div class="cmsg" id="cmsg" aria-live="polite"></div>
    <div class="sugs" id="sugs"></div>

</div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="dlgw" id="dlgw" hidden>

</div>

/* ---------- Toast, Dialog, Export ---------- */

  if (d.jfocus != null) { const i = +d.jfocus; fitTo({ x: jx(i) - 20, y: 70, w: JW + 40, h: 860 }, 30, 1.2); return; }
  if (d.card) { if (state.mode !== 'journey') setMode('journey'); select({ k: 'card', id: d.card }); revealCard(d.card); return; }
  if (d.comp) { state.comp = state.comp === d.comp ? null : d.comp; if (state.mode === 'journey' || state.mode === 'proto') setMode('design'); markComp(); renderLeft(); return; }
  if (d.pgo) { const p = state.proto; p.cur = d.pgo; p.hist.push(d.pgo); renderProto('fwd'); renderLeft(); renderRight(); return; }

  if (d.hot) { state.proto.hot = !state.proto.hot; renderProto(); renderRight(); return; }
